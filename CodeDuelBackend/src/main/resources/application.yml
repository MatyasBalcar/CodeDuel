spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1026}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.starttls.required: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  application:
    name: codeduel
  session:
    timeout: 8h
    jdbc:
      initialize-schema: never
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5444/codeduel}
    username: ${DATABASE_USER:codeduel}
    password: ${DATABASE_PASSWORD:codeduel_local}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    async:
      request-timeout: 300000
  task:
    scheduling:
      pool:
        size: 4
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
        name: CODEDUEL_SESSION
  tomcat:
    max-http-form-post-size: 96KB
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
codeduel:
  public-url: ${PUBLIC_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@codeduel.local}
    local-only: ${LOCAL_MAIL:false}
  require-verified-email: false
  source-retention-days: 90
  seed-enabled: true
  scheduling-enabled: true
  worker-enabled: false
  judge:
    mode: ${JUDGE_MODE:DISABLED}
    base-url: ${JUDGE_URL:${JUDGE0_URL:}}
    auth-token: ${JUDGE_AUTH_TOKEN:${JUDGE0_AUTH_TOKEN:}}
    java-language-id: ${JUDGE0_JAVA_LANGUAGE_ID:0}
    java-language-name: ${JUDGE0_JAVA_LANGUAGE_NAME:Java (OpenJDK 21)}
  battle:
    ready-seconds: 30
    start-delay-seconds: 3
  queue:
    capacity: 1000
    stale-seconds: 90
