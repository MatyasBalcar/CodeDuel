name: Verify CodeDuel
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: CodeDuelFrontend/package-lock.json
      - name: Backend format, unit and PostgreSQL concurrency tests
        run: ./mvnw -B -ntp verify
      - name: Verify problem reference solutions
        run: python3 problems/verify_catalog.py
      - name: Frontend dependencies
        working-directory: CodeDuelFrontend
        run: npm ci
      - name: Frontend format, types, lint, unit tests and build
        working-directory: CodeDuelFrontend
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: Install Chromium
        working-directory: CodeDuelFrontend
        run: npx playwright install --with-deps chromium
      - name: Build and start the complete local demo
        run: docker compose up -d --build db api frontend
      - name: Wait for demo readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5173/api/v1/system | python3 -c 'import json,sys; assert json.load(sys.stdin)["judgeMode"] == "FIXTURE"'; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs api frontend
          exit 1
      - name: Two-player Chromium journeys through Nginx
        working-directory: CodeDuelFrontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          MAILPIT_URL: http://127.0.0.1:8026
        run: npm run test:e2e
      - name: Collect runtime logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: failure-reports
          path: |
            CodeDuelBackend/target/surefire-reports
            CodeDuelBackend/target/failsafe-reports
            CodeDuelFrontend/playwright-report
            CodeDuelFrontend/test-results
            compose.log
          retention-days: 7
      - name: Stop demo containers
        if: always()
        run: docker compose down
