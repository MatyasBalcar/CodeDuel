resolver 127.0.0.11 valid=10s ipv6=off;
upstream codeduel_api {
    zone codeduel_api 64k;
    server api:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 96k;
    # SPA invite routes and same-origin Referer headers can contain one-use tokens.
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/v1/admin/problems {
        client_max_body_size 4m;
        proxy_pass http://codeduel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-CodeDuel-Client-IP $http_x_codeduel_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 310s;
        proxy_cache off;
        access_log off;
    }
    location /api/ {
        proxy_pass http://codeduel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-CodeDuel-Client-IP $http_x_codeduel_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 310s;
        proxy_cache off;
        access_log off;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
