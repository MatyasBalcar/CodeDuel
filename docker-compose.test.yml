services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: codeduel_local
  api:
    image: codeduel-api:checks
    ports: !reset []
    environment:
      DATABASE_PASSWORD: codeduel_local
      SPRING_PROFILES_ACTIVE: demo
      JUDGE_MODE: FIXTURE
      PUBLIC_URL: http://127.0.0.1:5175
      COOKIE_SECURE: "false"
  mailpit:
    ports: !override
      - "127.0.0.1:8027:8025"
  frontend:
    image: codeduel-frontend:checks
    ports: !override
      - "127.0.0.1:5175:8080"
